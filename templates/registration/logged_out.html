{% extends "base.html" %}

{% block content %}
<p>Logged out!</p>

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% url 'login' %}" />
    <button type="submit" class="btn btn-link">Click here to login again</button>
</form>
{% endblock %}
