{% load crispy_forms_filters %}

<form action="" method="get" class="row g-2 align-items-center align-self-end">
  <div class="col-auto">
    {{ search_form.search_field|as_crispy_field }}
  </div>
  <div class="col-auto">
    {{ search_form.search_query|as_crispy_field }}
  </div>
  <div class="col-auto">
    {{ search_form.ordering|as_crispy_field }}
  </div>
  <div class="col-auto" style="top: 13px">
    <input type="submit" value="Search & Sort" class="btn btn-primary">
  </div>
</form>
